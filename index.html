<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>RSVP Table</title>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="filter-section">
        <select id="status-filter">
          <option value="total">Total</option>
          <option value="confirm">Confirmed</option>
          <option value="decline">Declined</option>
        </select>
        <div class="count-badge">
          <span id="total-count">0</span> guests
        </div>
      </div>
      <button id="add-new-btn" class="add-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
        Add New
      </button>
    </div>

    <div class="table-container">
      <table id="rsvp-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Last Name</th>
            <th>First Name</th>
            <th>Birthday</th>
            <th>RSVP Status</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="add-form-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Add New Guest</h3>
          <button id="close-modal" class="close-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <form id="add-guest-form">
          <div class="form-row">
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" name="lastName" required>
            </div>
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" name="firstName" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="birthday">Birthday</label>
              <input type="date" id="birthday" name="birthday" required>
            </div>
            <div class="form-group">
              <label for="rsvpStatus">RSVP Status</label>
              <select id="rsvpStatus" name="rsvpStatus" required>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
                <option value="Maybe">Maybe</option>
              </select>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="submit-btn">Add Guest</button>
            <button type="button" id="cancel-btn" class="cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  </div>

  <!-- Status Change Confirmation Modal -->
  <div id="confirm-modal-overlay" class="modal-overlay hidden">
    <div id="confirm-modal" class="modal confirm-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Confirm Status Change</h3>
          <button id="close-confirm-modal" class="close-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="confirm-content">
          <p>Are you sure you want to change the RSVP status to <span id="new-status-value">New Status</span>?</p>
        </div>
        <div class="confirm-actions">
          <button id="confirm-yes-btn" class="submit-btn">Yes</button>
          <button id="confirm-no-btn" class="cancel-btn">No</button>
        </div>
      </div>
    </div>
  </div>



  <script type="module" src="/dist/main.js"/>
</body>
</html>
